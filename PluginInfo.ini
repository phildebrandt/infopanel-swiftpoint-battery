[Plugin]
Name=Swiftpoint Battery
Description=Shows Swiftpoint Z3 battery level, charging state, connection (SwiftLink/USB/Bluetooth) and active X1 profile. Reads the Swiftpoint X1 Control Panel log - requires X1 3.1.2+ running with VerboseLogging=true.
Author=Patrick
Version=1.0.0
Website=https://github.com/phildebrandt/infopanel-swiftpoint-battery
